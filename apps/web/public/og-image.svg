<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Site-wide share preview.

       Everything readable is centred inside a 616px-wide band, because
       Facebook renders a link card in a near-square box on mobile and
       centre-crops this 1200x630 image down to about 630x630 — a
       left-aligned composition loses the start of the wordmark and of the
       headline. Only the ground and the decorative blobs live outside that
       band. Re-run `pnpm og:generate` from apps/web after edits. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#fdf9f4"/>
      <stop offset="100%" stop-color="#f4ebdf"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative blobs, symmetric so the crop stays balanced -->
  <circle cx="1100" cy="60" r="280" fill="#358891" opacity="0.06"/>
  <circle cx="100" cy="570" r="240" fill="#358891" opacity="0.05"/>
  <rect x="0" y="0" width="14" height="630" fill="#358891"/>
  <rect x="1186" y="0" width="14" height="630" fill="#358891"/>

  <!-- Heart lockup (matches the in-app logo), centred as one unit -->
  <g transform="translate(487, 92)">
    <rect width="96" height="96" rx="24" fill="#358891"/>
    <!-- The heart's ink sits low in its 120x120 coordinate space; the shift
         centres the glyph itself inside the teal square. -->
    <g transform="translate(-12, -17.4) scale(0.8)">
      <path d="M60 92c-1.5 0-3-0.6-4.1-1.7L33.5 67.9c-6-6-6-15.8 0-21.8 5.3-5.3 13.5-6 19.5-1.9l7 4.8 7-4.8c6-4.1 14.2-3.4 19.5 1.9 6 6 6 15.8 0 21.8L64.1 90.3C63 91.4 61.5 92 60 92z" fill="#fdf9f4"/>
    </g>
    <text x="122" y="72" font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" font-size="84" fill="#1f2937" letter-spacing="-2.5">Tokō</text>
  </g>

  <!-- Primary headline -->
  <g text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="54" letter-spacing="-1.2">
    <text x="600" y="300" fill="#1f2937">App TDAH enfant</text>
    <text x="600" y="368" fill="#358891">pour parents épuisés.</text>
  </g>

  <!-- Sub-tagline pills -->
  <g font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="24" fill="#1f2937">
    <g transform="translate(318, 432)">
      <rect width="172" height="56" rx="28" fill="#ffffff" stroke="#358891" stroke-opacity="0.25" stroke-width="2"/>
      <text x="86" y="36" text-anchor="middle">Routines</text>
    </g>
    <g transform="translate(506, 432)">
      <rect width="142" height="56" rx="28" fill="#ffffff" stroke="#358891" stroke-opacity="0.25" stroke-width="2"/>
      <text x="71" y="36" text-anchor="middle">Suivi</text>
    </g>
    <g transform="translate(664, 432)">
      <rect width="218" height="56" rx="28" fill="#ffffff" stroke="#358891" stroke-opacity="0.25" stroke-width="2"/>
      <text x="109" y="36" text-anchor="middle">Plan de crise</text>
    </g>
  </g>

  <!-- Footer URL -->
  <text x="600" y="548" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="24" fill="#358891" opacity="0.75">toko.battistella.ovh</text>
</svg>
