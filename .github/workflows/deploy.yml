name: Deploy — homelab

# Manual escape hatch, run on the self-hosted runner alongside the target
# docker host: pulls `:latest` from GHCR, reconciles the compose stack, and
# prunes dangling images. Use it to re-pull by hand, or to recover the
# stack after a failed deploy.
#
# It no longer fires automatically after Release. The Release workflow's
# own deploy job (deploy/deploy.sh) rolls back to the previous image when
# the new one fails its health check — and this workflow, firing seconds
# later, would re-pull the same broken `:latest` from GHCR and undo exactly
# that rollback. Automatic deploys go through Release; this stays on hand.

on:
  workflow_dispatch:

concurrency:
  group: deploy-homelab-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Pull & reconcile
    runs-on: [self-hosted]
    defaults:
      run:
        working-directory: /opt/docker/toko
    steps:
      - name: Pull latest image(s)
        run: docker compose pull

      - name: Reconcile stack
        run: docker compose up -d

      - name: Show status
        run: docker compose ps

      - name: Prune dangling images
        working-directory: /
        run: docker image prune -f
