name: Android APK (test)

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: "ABIs natives (séparées par des virgules)"
        required: false
        type: string
        default: "arm64-v8a"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK (debug-signed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace --config.node-linker=hoisted

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Check release uses the debug signing config
        run: |
          gradle_file=android/app/build.gradle
          test -f android/app/debug.keystore || { echo "::error::android/app/debug.keystore missing after prebuild"; exit 1; }
          if ! awk '/buildTypes[[:space:]]*\{/{b=1} b&&/release[[:space:]]*\{/{r=1} r&&/signingConfig[[:space:]]+signingConfigs\.debug/{found=1; exit} END{exit !found}' "$gradle_file"; then
            echo "::error::release buildType is not signed with signingConfigs.debug in $gradle_file"
            exit 1
          fi
          echo "release buildType signed with signingConfigs.debug"

      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        env:
          ABIS: ${{ inputs.architectures || 'arm64-v8a' }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures="$ABIS"

      - name: Name the APK
        id: apk
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          name="toko-test-${short_sha}.apk"
          mkdir -p ../../dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk "../../dist-apk/${name}"
          ls -l ../../dist-apk
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toko-apk-${{ steps.apk.outputs.short_sha }}
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 14
