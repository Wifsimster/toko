name: Cron

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  reminders:
    name: Reminders (every 5min)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL || 'https://toko.battistella.ovh' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Guard
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set"
            exit 1
          fi
      - name: Daily reminders
        run: |
          curl -sS --fail-with-body -X POST "$APP_URL/api/jobs/daily-reminders" \
            -H "x-cron-secret: $CRON_SECRET"
      - name: Evening reminders
        run: |
          curl -sS --fail-with-body -X POST "$APP_URL/api/jobs/evening-reminders" \
            -H "x-cron-secret: $CRON_SECRET"
      - name: Weekly digest
        run: |
          curl -sS --fail-with-body -X POST "$APP_URL/api/jobs/weekly-digest" \
            -H "x-cron-secret: $CRON_SECRET"

  hourly:
    name: Hourly maintenance
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * *'
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL || 'https://toko.battistella.ovh' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Guard
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set"
            exit 1
          fi
      - name: Trial-ending reminders
        run: |
          curl -sS --fail-with-body -X POST "$APP_URL/api/jobs/trial-ending-reminders" \
            -H "x-cron-secret: $CRON_SECRET"
      - name: Barkley formation reminders
        run: |
          curl -sS --fail-with-body -X POST "$APP_URL/api/jobs/formation-reminders" \
            -H "x-cron-secret: $CRON_SECRET"
      - name: Email verification reminders
        run: |
          curl -sS --fail-with-body -X POST "$APP_URL/api/jobs/verification-reminders" \
            -H "x-cron-secret: $CRON_SECRET"
      - name: Purge old IPs
        run: |
          curl -sS --fail-with-body -X POST "$APP_URL/api/jobs/purge-ips" \
            -H "x-cron-secret: $CRON_SECRET"
      - name: Purge scheduled deletions
        run: |
          curl -sS --fail-with-body -X POST "$APP_URL/api/jobs/purge-scheduled-deletions" \
            -H "x-cron-secret: $CRON_SECRET"
      - name: Purge retention (old events, expired invitations)
        run: |
          curl -sS --fail-with-body -X POST "$APP_URL/api/jobs/purge-retention" \
            -H "x-cron-secret: $CRON_SECRET"
